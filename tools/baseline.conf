# The glibc release artifacts are allowed to require.
#
# This is a promise, not a measurement.  The floor of any given artifact is
# whatever symbol versions the build host's glibc happened to hand the linker,
# so it is a property of the machine that compiled the code rather than of the
# code: the same tree built on an older glibc asks for less.  `make baseline`
# therefore fails only when an artifact needs *more* than is promised here, and
# a build on a newer host is not silently accepted just because it succeeded.
#
# To lower this floor, build on an older glibc -- an AlmaLinux 8 or Debian 11
# container glibc 2.28, or a manylinux2014 glibc 2.17 image -- rather than
# editing the number.  Raising it is a decision about which distributions are
# supported, and the evidence in dist/BASELINE.txt has to support it.
GLIBC_FLOOR=2.38
