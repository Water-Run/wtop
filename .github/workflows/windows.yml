name: Windows development bundles

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README*.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WTOP_SKIP_RESOURCE_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build the XP-targeted Lua and native module
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686 gcc-mingw-w64-x86-64
          ./tools/build_windows_x86.sh
          mkdir ci-inputs
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include -Ibuild/native -Ibuild/windows-x86 \
            tests/native/windows_inventory.c native/wtop_windows.c native/wtop_windows_worker.c native/wtop_windows_cpuid.c native/wtop_windows_cpu.c native/wtop_windows_net.c native/wtop_windows_disk.c \
            dist/windows-x86/liblua55.dll.a -lpsapi -liphlpapi -lsetupapi \
            -o ci-inputs/inventory-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include -Ibuild/native -Ibuild/windows-x86 \
            tests/native/windows_disk.c native/wtop_windows.c native/wtop_windows_worker.c native/wtop_windows_cpuid.c native/wtop_windows_cpu.c native/wtop_windows_hw.c native/wtop_windows_net.c \
            dist/windows-x86/liblua55.dll.a -lpsapi -liphlpapi -lsetupapi \
            -o ci-inputs/disk-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include -Ibuild/native -Ibuild/windows-x86 \
            tests/native/windows_network.c native/wtop_windows.c native/wtop_windows_worker.c native/wtop_windows_cpuid.c native/wtop_windows_cpu.c native/wtop_windows_net.c native/wtop_windows_disk.c \
            dist/windows-x86/liblua55.dll.a -lpsapi -liphlpapi -lsetupapi \
            -o ci-inputs/network-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include -Ibuild/native -Ibuild/windows-x86 \
            tests/native/windows_network_table.c native/wtop_windows.c native/wtop_windows_worker.c native/wtop_windows_cpuid.c native/wtop_windows_cpu.c native/wtop_windows_hw.c native/wtop_windows_disk.c \
            dist/windows-x86/liblua55.dll.a -lpsapi -liphlpapi -lsetupapi \
            -o ci-inputs/network-table-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include tests/native/windows_cpu.c \
            dist/windows-x86/liblua55.dll.a -o ci-inputs/cpu-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include tests/native/windows_frequency.c \
            dist/windows-x86/liblua55.dll.a -o ci-inputs/frequency-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include tests/native/windows_hardware_worker.c \
            dist/windows-x86/liblua55.dll.a -o ci-inputs/hardware-worker-fixture.exe
          i686-w64-mingw32-gcc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc \
            -Idist/windows-x86/include -Ibuild/windows-x86 tests/native/windows_cpuid.c \
            dist/windows-x86/liblua55.dll.a -o ci-inputs/cpuid-fixture.exe
          python3 tests/test_windows_nvml.py --build --output ci-inputs/nvml-fixtures
          rm -rf ci-inputs/nvml-fixtures
          python3 tests/test_windows_storage.py --build --output ci-inputs/storage-fixtures
          rm -rf ci-inputs/storage-fixtures
          tar -czf ci-inputs/runtime.tar.gz -C dist windows-x86
      - name: Fetch the native x86 compiler
        run: |
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://github.com/skeeto/w64devkit/releases/download/v1.23.0/w64devkit-i686-1.23.0.zip \
            -o ci-inputs/w64devkit-i686-1.23.0.zip
          test "$(stat -c %s ci-inputs/w64devkit-i686-1.23.0.zip)" = 72803726
          cd ci-inputs
          echo '033ef6a29bfcb5ef4452ec5219ed74b64b95d56ae71c9252996e77dd777ab7bf  w64devkit-i686-1.23.0.zip' | sha256sum -c -
          sha256sum runtime.tar.gz w64devkit-i686-1.23.0.zip inventory-fixture.exe disk-fixture.exe network-fixture.exe network-table-fixture.exe cpu-fixture.exe frequency-fixture.exe hardware-worker-fixture.exe cpuid-fixture.exe nvml-fixtures.zip storage-fixtures.zip | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-inputs
          path: ci-inputs/
          if-no-files-found: error
          retention-days: 3

  bundle:
    needs: runtime
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-build-inputs
          path: ci-inputs
      - name: Verify inputs and prepare the native compiler
        shell: pwsh
        run: |
          foreach ($line in Get-Content ci-inputs/SHA256SUMS) {
            $hash, $name = $line -split '  ', 2
            if ((Get-FileHash (Join-Path ci-inputs $name) -Algorithm SHA256).Hash.ToLower() -ne $hash) {
              throw "Input checksum mismatch: $name"
            }
          }
          New-Item -ItemType Directory -Force dist, build, .tools | Out-Null
          tar -xzf ci-inputs/runtime.tar.gz -C dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive ci-inputs/w64devkit-i686-1.23.0.zip .tools/windows-compiler
          # The verified upstream cc1 is PE32 without LARGEADDRESSAWARE and
          # exhausts 2 GiB compiling the onefile payload. Change only the
          # disposable build-host compiler; produced programs still target XP.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $editbin = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC/Tools/MSVC/**/bin/Hostx64/x64/editbin.exe' | Select-Object -First 1
          if (-not $editbin) { throw 'MSVC editbin is required to prepare the x86 build compiler' }
          $frontends = @(Get-ChildItem .tools/windows-compiler -Recurse -Filter cc1.exe)
          if ($frontends.Count -ne 1) { throw 'Expected exactly one verified C compiler frontend' }
          Get-FileHash $frontends[0].FullName -Algorithm SHA256
          & $editbin /LARGEADDRESSAWARE $frontends[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash $frontends[0].FullName -Algorithm SHA256
          python -c "from pathlib import Path; import struct; root=Path('.tools/windows-compiler'); names={'gcc.exe','cc1.exe','as.exe','ld.exe'}; [(lambda d: print(p.name, 'large-address-aware=', bool(struct.unpack_from('<H', d, struct.unpack_from('<I', d, 60)[0]+22)[0] & 32)))(p.read_bytes()) for p in root.rglob('*.exe') if p.name in names]"
      - name: Native hardware inventory regressions
        shell: pwsh
        run: |
          Copy-Item ci-inputs/inventory-fixture.exe dist/windows-x86/
          & ./dist/windows-x86/inventory-fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/windows-x86/inventory-fixture.exe
          Copy-Item ci-inputs/disk-fixture.exe dist/windows-x86/
          & ./dist/windows-x86/disk-fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist/windows-x86/disk-fixture.exe
          foreach ($fixture in 'network-fixture.exe', 'network-table-fixture.exe', 'cpu-fixture.exe', 'frequency-fixture.exe', 'hardware-worker-fixture.exe', 'cpuid-fixture.exe') {
            Copy-Item (Join-Path ci-inputs $fixture) dist/windows-x86/
            & (Join-Path ./dist/windows-x86 $fixture)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Remove-Item (Join-Path dist/windows-x86 $fixture)
          }
      - name: Native NVML reader and cache regressions
        shell: pwsh
        run: |
          Expand-Archive ci-inputs/nvml-fixtures.zip build/nvml-fixtures
          python tests/test_windows_nvml.py --output build/nvml-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native storage API isolation and lifecycle regressions
        shell: pwsh
        run: |
          Expand-Archive ci-inputs/storage-fixtures.zip build/storage-fixtures
          python tests/test_windows_storage.py --output build/storage-fixtures
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package both forms and check every PE image
        shell: pwsh
        run: |
          $cc = Join-Path $PWD '.tools/windows-compiler/w64devkit/bin/gcc.exe'
          $env:PATH = "$(Split-Path $cc);$env:PATH"
          & $cc --version
          python tools/package_windows.py dir --compiler $cc --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_windows.py file --compiler $cc --verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $cc -std=c17 -O2 -Wall -Wextra -Werror -static-libgcc tools/console_harness.c -o build/console_harness.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Installed CLI and real console checks
        shell: pwsh
        run: |
          $version = (Get-Content VERSION).Trim()
          foreach ($exe in 'dist/windows-bundle/wtop/wtop.exe', 'dist/windows-bundle/wtop-onefile.exe') {
            python tests/installed_smoke.py --executable $exe --version $version --platform Windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python tests/windows_console_smoke.py --executable $exe --harness build/console_harness.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Archive the complete development packages
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import zipfile
          root = Path('dist/windows-bundle')
          with zipfile.ZipFile('dist/wtop-windows-x86.zip', 'w', zipfile.ZIP_DEFLATED, allowZip64=False) as archive:
              for path in sorted(root.rglob('*')):
                  if path.is_file():
                      archive.write(path, path.relative_to(root).as_posix())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/wtop-windows-x86.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  wtop-windows-x86.zip" | Set-Content -Encoding ascii dist/wtop-windows-x86.zip.sha256
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-debug-bundles
          path: |
            dist/windows-bundle/
            build/storage-fixtures/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86-development
          path: |
            dist/wtop-windows-x86.zip
            dist/wtop-windows-x86.zip.sha256
          if-no-files-found: error
